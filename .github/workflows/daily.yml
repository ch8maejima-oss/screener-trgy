# 日次のスクリーニング更新と XServer Static へのデプロイ。
#
# 財務データ（有価証券報告書）は年1回しか変わらないため、この処理では取得しない。
# 日次で変動するのは株価と配当だけなので、それを取り直して条件1を再判定し、
# サイトを再ビルドして公開する。
name: 日次更新とデプロイ

on:
  schedule:
    # UTC 09:30 = JST 18:30。東証の大引け(15:30)後、株価が確定してから実行する。
    - cron: "30 9 * * 1-5"
  workflow_dispatch: # 手動実行も可能にする

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 更新した結果をリポジトリに書き戻すため
    env:
      # if: 条件式では secrets コンテキストを直接参照できないため、env経由にする。
      # EA EXPO商品作成・Secrets登録が完了するまでは有料データ配信ステップ一式をスキップし、
      # 既存の /dividend・/daytrade の通常デプロイに影響が出ないようにする。
      SCREENER_PAID_READY: ${{ secrets.XSERVER_SCREENER_PRIVATE_DATA_DIR != '' && secrets.XSERVER_MUPLUGINS_DIR != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python依存関係のインストール
        run: pip install -r requirements.txt

      - name: スクリーニング実行（株価・配当を取得して再判定）
        run: python scripts/screen.py

      - name: サイト用データの生成
        run: python scripts/build_site_data.py

      - name: 貸借銘柄一覧の取得
        run: python scripts/fetch_margin_list.py

      - name: デイトレード用スクリーニング実行
        run: python scripts/screen_daytrade.py

      - name: デイトレード用サイトデータの生成
        run: python scripts/build_daytrade_site_data.py

      - name: 有料データの非公開化を検証
        # 銘柄配列(stocks)はEA EXPO購入者限定のゲート配信データであり、Next.jsの
        # ビルドにそのまま埋め込まれる app/*/data/ 配下の公開JSONに含まれてはならない
        # （代わりに private-data/ に出力され、そちらだけがゲート配信対象になる）。
        # ビルド前に検証することで、事故があれば早く気づける。
        run: |
          test -f private-data/dividend/stocks.json || { echo "private-data/dividend/stocks.json がありません"; exit 1; }
          test -f private-data/daytrade/buy.json || { echo "private-data/daytrade/buy.json がありません"; exit 1; }
          test -f private-data/daytrade/short.json || { echo "private-data/daytrade/short.json がありません"; exit 1; }
          python -c "
          import json, sys
          from pathlib import Path

          def check(path):
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              if 'stocks' in data:
                  sys.exit(f'ERROR: {path} に銘柄配列(stocks)が含まれています（公開JSONに残っています）')
              for sub in ('buy', 'short'):
                  if sub in data and 'stocks' in data[sub]:
                      sys.exit(f'ERROR: {path} の {sub} に銘柄配列(stocks)が含まれています')

          check('app/dividend/data/latest.json')
          check('app/daytrade/data/latest.json')
          for p in Path('app/daytrade/data/archive').glob('*.json'):
              check(p)
          print('公開JSONに銘柄配列が含まれていないことを確認しました')
          "

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: サイトのビルド
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_AD_SLOT: ${{ secrets.ADSENSE_AD_SLOT }}
        run: |
          npm ci
          npm run build

      - name: ビルド結果の検証
        # 空ディレクトリを配信して既存サイトを消してしまう事故を防ぐ
        run: |
          test -f out/index.html || { echo "out/index.html がありません"; exit 1; }
          test -f out/dividend/index.html || { echo "out/dividend/index.html がありません"; exit 1; }
          test -f out/daytrade/index.html || { echo "out/daytrade/index.html がありません"; exit 1; }
          test -f out/daytrade/archive/index.html || { echo "out/daytrade/archive/index.html がありません"; exit 1; }
          grep -q "スクリーニング銘柄一覧" out/index.html || { echo "本文が生成されていません"; exit 1; }
          echo "出力ファイル数: $(find out -type f | wc -l)"

      - name: 転送先パスの検証
        # mirror --delete は転送先の不要ファイルを削除する。パスの設定を誤ると
        # 他サイトのディレクトリを消しかねないため、本サイト専用の場所を指しているか確認する。
        env:
          FTP_REMOTE_DIR: ${{ secrets.XSERVER_FTP_REMOTE_DIR }}
        run: |
          # Xserverのサブドメイン設定はドキュメントルートを2形式から選べるため、
          # screener.trgy.co.jp / screener のどちらの命名でも受け付ける。
          case "$FTP_REMOTE_DIR" in
            */public_html/screener.trgy.co.jp|*/public_html/screener.trgy.co.jp/|\
            */public_html/screener|*/public_html/screener/)
              echo "転送先: $FTP_REMOTE_DIR" ;;
            *)
              echo "転送先が screener 専用ディレクトリではありません: '$FTP_REMOTE_DIR'"
              echo "XSERVER_FTP_REMOTE_DIR には次のいずれかを指定してください。"
              echo "  /trgy.co.jp/public_html/screener.trgy.co.jp"
              echo "  /trgy.co.jp/public_html/screener"
              exit 1 ;;
          esac

      - name: 非公開データ配信パスの検証
        # XSERVER_SCREENER_PRIVATE_DATA_DIR / XSERVER_MUPLUGINS_DIR が未登録の間
        # （EA EXPO商品作成・Secrets登録が完了するまで）はこのステップごとスキップし、
        # 既存の /dividend・/daytrade の通常デプロイに影響が出ないようにする。
        if: ${{ env.SCREENER_PAID_READY == 'true' }}
        env:
          FTP_PRIVATE_DATA_DIR: ${{ secrets.XSERVER_SCREENER_PRIVATE_DATA_DIR }}
          FTP_MUPLUGINS_DIR: ${{ secrets.XSERVER_MUPLUGINS_DIR }}
        run: |
          # 非公開データ用ディレクトリ(ea-exposition.com側)はscreener専用の場所であること。
          # mirror --delete をそのまま使うため、誤って他サイトのデータを消さないよう確認する。
          case "$FTP_PRIVATE_DATA_DIR" in
            */wp-content/private/screener-data|*/wp-content/private/screener-data/)
              echo "非公開データ転送先: $FTP_PRIVATE_DATA_DIR" ;;
            *)
              echo "非公開データ転送先が screener-data 専用ディレクトリではありません: '$FTP_PRIVATE_DATA_DIR'"
              exit 1 ;;
          esac
          # mu-plugins配置先には既存のtrilogy-dividend-gate.phpも同居しているため、
          # 単一ファイルのputのみ許可する（mirror --deleteは使わない）。パスの形だけ確認する。
          case "$FTP_MUPLUGINS_DIR" in
            */wp-content/mu-plugins|*/wp-content/mu-plugins/)
              echo "mu-plugins転送先: $FTP_MUPLUGINS_DIR" ;;
            *)
              echo "mu-plugins転送先が想定外です: '$FTP_MUPLUGINS_DIR'"
              exit 1 ;;
          esac

      # 転送先には Xserver が無料独自SSLの発行確認に使うファイルが置かれることがある。
      # --delete で消すと証明書の発行・更新に失敗するため .well-known と .htaccess は除外する。
      - name: Xserver へデプロイ
        timeout-minutes: 15
        env:
          FTP_HOST: ${{ secrets.XSERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.XSERVER_FTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror -R --delete --verbose -x '^\.well-known' -x '^\.htaccess$' out/ \"$FTP_REMOTE_DIR\";
          "

      - name: 非公開データをea-exposition.comへデプロイ
        # 銘柄配列(stocks)はEA EXPO購入者限定のゲート配信データのため、screener.trgy.co.jp
        # の公開フォルダには置かない。同一Xserverアカウント内、ea-exposition.com側の
        # 非公開フォルダへ転送し、WordPress側のtrilogy-screener-gate.php
        # （wp-content/mu-plugins/）が注文番号・メールアドレスの検証を通った場合のみ
        # このデータを返す。private-data/.htaccess（Deny from all）も一緒に転送される。
        # このディレクトリはscreener専用の新規パスのため --delete を使っても安全。
        if: ${{ env.SCREENER_PAID_READY == 'true' }}
        timeout-minutes: 15
        env:
          FTP_HOST: ${{ secrets.XSERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
          FTP_PRIVATE_DATA_DIR: ${{ secrets.XSERVER_SCREENER_PRIVATE_DATA_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror -R --delete --verbose private-data/ \"$FTP_PRIVATE_DATA_DIR\";
          "

      - name: mu-pluginをea-exposition.comへデプロイ
        # wp-content/mu-plugins/ には dividend.trgy.co.jp 用の trilogy-dividend-gate.php も
        # 同居しているため、mirror --delete は使わずファイル1つだけを put する
        # （既存ファイルを誤って消さないため）。
        if: ${{ env.SCREENER_PAID_READY == 'true' }}
        timeout-minutes: 5
        env:
          FTP_HOST: ${{ secrets.XSERVER_FTP_HOST }}
          FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
          FTP_MUPLUGINS_DIR: ${{ secrets.XSERVER_MUPLUGINS_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            put wordpress/trilogy-screener-gate.php -o \"$FTP_MUPLUGINS_DIR/trilogy-screener-gate.php\";
          "

      - name: 結果をリポジトリに記録
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output app/dividend/data app/daytrade/data data/master/margin_list.csv private-data
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "日次更新: $(date -u -d '+9 hours' '+%Y-%m-%d')"
            git push
          fi
